[package]
name = "datamapper"
version = "0.2.1-alpha"
edition = "2021"
rust-version = "1.88"
authors = ["Rainer Türner"]
license = "Apache-2.0"
description = "DataMapper — Handlebars template folder → REST endpoint proxy."
repository = "https://github.com/turnerrainer/datamapper"

[dependencies]
# Web framework + async runtime
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Domain
handlebars = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "2"
anyhow = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `v4` for random 128-bit trace ids in the W3C traceparent
# response middleware (FLEET §1.6). Default features off — we
# only need v4 random ids, not the DCE / MAC-address variants.
uuid = { version = "1", default-features = false, features = ["v4"] }
# CLI parsing for the `datamapper doctor` subcommand (FLEET §8.2
# pre-boot validation). `derive` for a clap-derive-based Cli /
# Subcommand definition — `usage` / `help` / `error-context`
# left on defaults.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[[bin]]
name = "datamapper"
path = "src/main.rs"

[lib]
name = "datamapper"
path = "src/lib.rs"

# Clippy posture — `cargo clippy --all-targets -- -D warnings` is the CI gate.
[lints.clippy]
