[package]
name = "datamapper-on-rust"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.88"
authors = ["Rainer Türner"]
license = "Apache-2.0"
description = "DataMapper — Rust implementation. Handlebars template folder → REST endpoint proxy."
repository = "https://github.com/Buerostack/DataMapper-on-Rust"

[dependencies]
# Web framework + async runtime
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Domain
handlebars = "6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "2"
anyhow = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"

[[bin]]
name = "datamapper-on-rust"
path = "src/main.rs"

[lib]
name = "datamapper_on_rust"
path = "src/lib.rs"

# Clippy posture — `cargo clippy --all-targets -- -D warnings` is the CI gate.
[lints.clippy]
