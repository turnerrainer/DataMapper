# cargo-audit configuration.
#
# Advisory IDs listed under `ignore` are downgraded to soft warnings
# so `cargo audit --deny warnings` still passes. Every entry MUST
# carry a rationale and a review date; unreviewed entries are a
# code smell.
#
# NOTE: any exception here MUST be mirrored in `deny.toml`'s
# `[advisories].ignore` — cargo-audit and cargo-deny do NOT share
# this file. See STANDARDS.md §5.

[advisories]
ignore = [
    # RUSTSEC-2024-0449 — `unsafe-libyaml 0.2.11` is unmaintained
    # (archived 2024-03-25). Pulled in transitively via
    # `serde_yaml_ng` → `unsafe-libyaml`; no safe upgrade is
    # available in the serde-yaml fork ecosystem.
    #
    # Risk assessment: DataMapper parses YAML exclusively at boot
    # from the operator-controlled `datamapper.yaml` file (never
    # from HTTP request input, never from DSL templates). The
    # attack surface for a YAML parser bug is a maintainer who
    # has write access to the config file — which is already game
    # over. The advisory is `unmaintained` (no known CVE), not an
    # active vulnerability.
    #
    # Evaluated 2026-10-14 — the obvious candidate replacement
    # `serde-saphyr 2.0.0` is NOT a drop-in: it re-opens the
    # h2ck.me N7 secret-leak lane. The current
    # `redact_serde_error` strips the `"..."` excerpt format that
    # `serde_yaml_ng` uses to echo the offending value; saphyr
    # inlines offending content between `|` characters AND emits
    # multiple context lines, so the existing redactor misses it
    # and the leak scope actually widens. Any future migration
    # must rewrite `redact_serde_error` + the three
    # `config::tests::n7_*` tests against the new parser's error
    # format before switching.
    #
    # Review by: 2027-01-15
    "RUSTSEC-2024-0449",
]
